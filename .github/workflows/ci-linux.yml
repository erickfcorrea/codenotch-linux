name: Linux CI & Release

on:
  push:
    branches: [main, linux-product]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-and-test:
    name: Build, Test & Package (Linux x86_64)
    timeout-minutes: 30
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check UI scripts and run JS unit tests
        run: |
          node scripts/check-ui-scripts.mjs
          for f in scripts/tests/test-*.cjs; do
            echo "Running $f"
            node --test "$f"
          done

      - name: Install Linux GTK / WebKit2GTK system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Build Tauri Linux bundles (.deb and .AppImage)
        run: npx @tauri-apps/cli@^2 build --config crates/codenotch/tauri.conf.json

      - name: Assemble distribution artifacts
        run: |
          mkdir -p dist/codenotch-linux
          find target/release/bundle/deb -name "*.deb" -exec cp {} dist/ \; || true
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist/ \; || true
          cp target/release/codenotch dist/codenotch-linux/
          cp target/release/codenotch-hook dist/codenotch-linux/
          cp crates/codenotch/qoder-usage.cjs dist/codenotch-linux/
          cp scripts/run-linux.sh dist/codenotch-linux/
          cp scripts/install-linux.sh dist/codenotch-linux/
          chmod +x dist/codenotch-linux/codenotch dist/codenotch-linux/codenotch-hook dist/codenotch-linux/*.sh
          tar -czf dist/codenotch-linux-x86_64.tar.gz -C dist codenotch-linux
          rm -rf dist/codenotch-linux

      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

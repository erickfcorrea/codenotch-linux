name: Linux Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/linux-package.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    name: Build Linux Packages (.deb, .AppImage, tarball)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for Tauri and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # Check UI scripts parse correctly
      - name: Check UI scripts
        run: node scripts/check-ui-scripts.mjs

      # Build codenotch-hook first
      - name: Build the hook
        run: |
          cargo build --release --locked -p codenotch-hook --target-dir target/hook
          mkdir -p target/release
          cp target/hook/release/codenotch-hook target/release/codenotch-hook

      # Build Tauri Linux bundles (.deb and .AppImage)
      - name: Build Tauri app (.deb and .AppImage)
        run: |
          npx @tauri-apps/cli@^2 build --config codenotch/tauri.linux.conf.json

      # Copy codenotch-hook next to the executable in bundle or packaging directory
      - name: Prepare distribution packages
        run: |
          mkdir -p dist
          # Find and copy deb
          find target/release/bundle/deb -name "*.deb" -exec cp {} dist/ \; || true
          # Find and copy AppImage
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist/ \; || true
          # Create a standalone tarball with codenotch, codenotch-hook, and run-linux.sh
          mkdir -p dist/codenotch-linux
          cp target/release/codenotch dist/codenotch-linux/
          cp target/release/codenotch-hook dist/codenotch-linux/
          cp scripts/run-linux.sh dist/codenotch-linux/
          chmod +x dist/codenotch-linux/codenotch dist/codenotch-linux/codenotch-hook dist/codenotch-linux/run-linux.sh
          tar -czf dist/codenotch-linux-x86_64.tar.gz -C dist codenotch-linux
          rm -rf dist/codenotch-linux

      # Upload artifacts for testing / commit download
      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-linux-${{ github.sha }}
          path: windows/dist/*
          if-no-files-found: error

      # Summary for run
      - name: Summary
        run: |
          echo "### Codenotch for Linux Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "Packages generated in \`dist/\`:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

      # Attach to release if a release was published
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
